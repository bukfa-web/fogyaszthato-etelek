<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Étel Adatbázis</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192x192.png" />
    <link rel="apple-touch-icon" href="icon-192x192.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-dropdown {
            position: relative;
            width: 100%;
        }
        .custom-dropdown input, .custom-dropdown select {
            width: 100%;
            padding: 8px;
            background-color: #374151;
            color: #f3f4f6;
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
        }
        .custom-dropdown .options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #374151;
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            display: none;
        }
        .custom-dropdown .options div {
            padding: 8px;
            cursor: pointer;
        }
        .custom-dropdown .options div:hover {
            background-color: #4b5563;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 p-4">
    <h1 class="text-3xl font-bold text-center mb-6">Étel Adatbázis</h1>
    <div class="text-center mb-6 text-cyan-400">
        <a href="tapanyag-ajanlas.html" class="hover:underline">Tápanyag Ajánlás (110 kg-os férfi számára)</a> |
        <a href="szemelyre-szabott-tapanyag.html" class="hover:underline">Személyre szabott számító</a>
    </div>

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-wrap gap-2 mb-4">
            <input type="text" id="searchInput" placeholder="Keresés..." class="flex-1 min-w-64 p-2 bg-gray-700 rounded text-white">
            <button id="clearSearchButton" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">Törlés</button>
            <button id="resetFiltersButton" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">Reset</button>
            <select id="recommendationFilter" class="bg-gray-700 text-white px-4 py-2 rounded">
                <option value="">Összes</option>
                <option value="Igen Kérek">Igen Kérek</option>
                <option value="Köszönöm nem kérek">Köszönöm nem kérek</option>
            </select>
            <select id="groupFilter" class="bg-gray-700 text-white px-4 py-2 rounded">
                <option value="">Oszlopok</option>
            </select>
            <button id="exportButton" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Export</button>
            <label class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded cursor-pointer">
                Import
                <input type="file" id="importInput" accept=".json" class="hidden">
            </label>
        </div>

        <table id="foodTable" class="w-full table-auto border-collapse">
            <thead class="bg-blue-800 text-white">
                <tr>
                    <th class="p-3 text-left cursor-pointer" data-sort="name">Megnevezés</th>
                    <th class="p-3 text-left cursor-pointer" data-sort="group">Étel csoport</th>
                    <th class="p-3 text-left cursor-pointer" data-sort="recommendation">Ajánlás</th>
                    <th class="p-3 text-left cursor-pointer" data-sort="note">Megjegyzés</th>
                    <th class="p-3 text-left">Műveletek</th>
                </tr>
            </thead>
            <tbody class="bg-gray-800"></tbody>
        </table>
    </div>

    <script>
        const initialFoodData = [
          {
            "name": "Áfonya",
            "group": "Gyümölcsök",
            "recommendation": "Igen Kérek",
            "note": "Antioxidánsokban gazdag, szezonálisan kis mennyiségben"
          },
          {
            "name": "Agvé",
            "group": "Finomított keményítőt tartalmazó ételek",
            "recommendation": "Köszönöm nem kérek",
            "note": "Magas fruktóztartalom, káros a bélflórára"
          },
          {
            "name": "Ajóka",
            "group": "Halak",
            "recommendation": "Igen Kérek",
            "note": "Omega-3 forrás, támogatja a szív egészségét"
          },
          {
            "name": "Alakor (einkorn búza)",
            "group": "Pszeudo-gabonák",
            "recommendation": "Köszönöm nem kérek",
            "note": "Lektintartalma miatt gyulladáskeltő"
          },
          {
            "name": "Alaszkai laposhal",
            "group": "Halak",
            "recommendation": "Igen Kérek",
            "note": "Alacsony higanytartalom, omega-3-ban gazdag"
          },
          {
            "name": "Alaszkai lazac",
            "group": "Halak",
            "recommendation": "Igen Kérek",
            "note": "Magas omega-3, gyulladáscsökkentő hatás"
          },
          {
            "name": "Alga olaj",
            "group": "Olajok",
            "recommendation": "Igen Kérek",
            "note": "Növényi omega-3 forrás, szívbarát"
          },
          {
            "name": "Alma",
            "group": "Gyümölcsök",
            "recommendation": "Igen Kérek",
            "note": "Prebiotikus rostok, szezonálisan kis mennyiségben"
          },
          // ... a teljes lista itt folytatódik (a <DOCUMENT>-ből a teljes tömb)
          // A teljes listát ide másold be, ahogy a foodData.json-ból van
          {
            "name": "Zöld tea",
            "group": "Italok",
            "recommendation": "Igen Kérek",
            "note": "Antioxidánsokban (katekin) gazdag, gyulladáscsökkentő, támogatja az anyagcserét – Dr. Balsai a természetes italokat javasolja"
          },
          {
            "name": "Zsálya",
            "group": "Fűszerek",
            "recommendation": "Igen Kérek",
            "note": "Gyulladáscsökkentő, immunerősítő – Dr. Balsai a természetes fűszereket javasolja"
          }
        ];

        let foodData = [];
        let currentData = [];
        let editingName = null;

        function loadDataFromLocalStorage() {
            const saved = localStorage.getItem('foodData');
            if (saved) {
                foodData = JSON.parse(saved);
            } else {
                foodData = initialFoodData.slice();
            }
            currentData = foodData.slice();
            renderTable();
            setupColumnSelector();
        }

        function renderTable() {
            const tbody = document.querySelector('#foodTable tbody');
            tbody.innerHTML = '';
            currentData.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = item.recommendation === 'Igen Kérek' ? 'bg-green-900' : 'bg-red-900';
                tr.innerHTML = `
                    <td class="p-3 border border-gray-700">${item.name}</td>
                    <td class="p-3 border border-gray-700">${item.group}</td>
                    <td class="p-3 border border-gray-700">${item.recommendation}</td>
                    <td class="p-3 border border-gray-700">${item.note}</td>
                    <td class="p-3 border border-gray-700">
                        <button class="bg-yellow-600 hover:bg-yellow-700 text-white px-3 py-1 rounded mr-2 edit-btn">Szerk.</button>
                        <button class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded delete-btn">Töröl</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportData() {
            const dataStr = JSON.stringify(foodData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'foodData_backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (!Array.isArray(imported)) throw new Error('Tömb szükséges');

                    let added = 0;
                    imported.forEach(newItem => {
                        if (!foodData.some(item => item.name.toLowerCase() === newItem.name.toLowerCase())) {
                            foodData.push(newItem);
                            added++;
                        }
                    });

                    localStorage.setItem('foodData', JSON.stringify(foodData));
                    currentData = foodData.slice();
                    renderTable();
                    alert(`Import kész! ${added} új étel hozzáadva. Összesen: ${foodData.length} étel.`);
                } catch (err) {
                    alert('Hibás JSON fájl!');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        // Eseménykezelők
        document.getElementById('searchInput').addEventListener('input', () => filterTable(currentData));
        document.getElementById('recommendationFilter').addEventListener('change', () => filterTable(currentData));
        document.getElementById('clearSearchButton').addEventListener('click', clearSearch);
        document.getElementById('resetFiltersButton').addEventListener('click', resetFilters);
        document.getElementById('exportButton').addEventListener('click', exportData);
        document.getElementById('importInput').addEventListener('change', importData);

        // Inicializálás
        loadDataFromLocalStorage();
    </script>
</body>
</html>
