<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Étel Adatbázis</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192x192.png" />
    <link rel="apple-touch-icon" href="icon-192x192.png" />
    <link href="./tailwind.css" rel="stylesheet">
    <style>
        .custom-dropdown {
            position: relative;
            width: 100%;
        }
        .custom-dropdown input, .custom-dropdown select {
            width: 100%;
            padding: 8px;
            background-color: #374151;
            color: #f3f4f6;
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
        }
        .custom-dropdown .options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #374151;
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            display: none;
        }
        .custom-dropdown .options div {
            padding: 8px;
            cursor: pointer;
        }
        .custom-dropdown .options div:hover {
            background-color: #4b5563;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 p-4">
    <h1 class="text-2xl font-bold text-center mb-4">Étel Adatbázis</h1>
    <div class="text-center mb-4">
        <a href="/fogyaszthato-etelek/tapanyag-ajanlas.html" class="text-cyan-400 hover:underline">Tápanyag Ajánlás (110 kg-os férfi számára)</a>
        | <a href="/fogyaszthato-etelek/szemelyre-szabott-tapanyag.html" class="text-cyan-400 hover:underline">Személyre szabott számító</a>
    </div>
    <div class="max-w-4xl mx-auto">
        <input type="text" id="searchInput" placeholder="Keresés..." class="w-full p-2 mb-4 bg-gray-700 border border-gray-600 rounded text-gray-200">
        <button id="clearSearchButton" class="bg-red-500 text-white px-4 py-2 rounded mr-2">Törlés</button>
        <button id="resetFiltersButton" class="bg-gray-500 text-white px-4 py-2 rounded mr-2">Szűrők Reset</button>
        <select id="recommendationFilter" class="bg-gray-700 text-gray-200 px-4 py-2 rounded mr-2">
            <option value="">Összes</option>
            <option value="Igen Kérek">Igen Kérek</option>
            <option value="Köszönöm nem kérek">Köszönöm nem kérek</option>
        </select>
        <div class="custom-dropdown inline-block mr-2">
            <select id="groupFilter" class="bg-gray-700 text-gray-200 px-4 py-2 rounded">
                <option value="">Oszlopok</option>
            </select>
            <div class="options"></div>
        </div>
        <button id="exportButton" class="bg-blue-500 text-white px-4 py-2 rounded mr-2">Műveletek</button>
        <input type="file" id="importInput" class="hidden">
        <table id="foodTable" class="w-full border-collapse border border-gray-600">
            <thead>
                <tr class="bg-blue-600 text-white">
                    <th data-sort="name">Megnevezés</th>
                    <th data-sort="group">Étel csoport</th>
                    <th data-sort="recommendation">Ajánlás</th>
                    <th data-sort="note">Megjegyzés</th>
                    <th>Műveletek</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        let foodData = [];
        let currentData = [];
        let editingName = null;

        function loadFoodData() {
            fetch('./foodData.json')
                .then(response => response.json())
                .then(data => {
                    foodData = data;
                    const savedData = localStorage.getItem('foodData');
                    if (savedData) {
                        foodData = JSON.parse(savedData);
                    }
                    renderTable();
                    updateStats();
                })
                .catch(error => console.error('Hiba a foodData.json betöltésekor:', error));
        }

        function renderTable() {
            const tableBody = document.querySelector('#foodTable tbody');
            tableBody.innerHTML = '';
            currentData.forEach(item => {
                const row = document.createElement('tr');
                row.dataset.name = item.name;
                row.innerHTML = `
                    <td class="border border-gray-600 p-2">${item.name}</td>
                    <td class="border border-gray-600 p-2">${item.group}</td>
                    <td class="border border-gray-600 p-2">${item.recommendation}</td>
                    <td class="border border-gray-600 p-2">${item.note}</td>
                    <td class="border border-gray-600 p-2">
                        <button class="edit-btn bg-yellow-500 text-white px-2 py-1 rounded mr-2">Szerk.</button>
                        <button class="delete-btn bg-red-500 text-white px-2 py-1 rounded">Töröl</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function filterTable(data) {
            currentData = data.filter(item => {
                const search = document.getElementById('searchInput').value.toLowerCase();
                const recommendation = document.getElementById('recommendationFilter').value;
                return (
                    item.name.toLowerCase().includes(search) &&
                    (recommendation === "" || item.recommendation === recommendation)
                );
            });
            renderTable();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filterTable(foodData);
        }

        function resetFilters() {
            document.getElementById('recommendationFilter').value = '';
            clearSearch();
        }

        function exportData() {
            const dataStr = JSON.stringify(foodData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "foodData.json";
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedData = JSON.parse(event.target.result);

                    if (!Array.isArray(importedData)) {
                        alert('Hibás JSON formátum!');
                        return;
                    }

                    // Bővítés: Hozzáadjuk az újakat, duplikátumok kihagyása (name alapján)
                    let added = 0;
                    importedData.forEach(newItem => {
                        if (!foodData.some(item => item.name.toLowerCase() === newItem.name.toLowerCase())) {
                            foodData.push(newItem);
                            added++;
                        }
                    });

                    localStorage.setItem('foodData', JSON.stringify(foodData));
                    filterTable(foodData);
                    alert(`${added} új étel hozzáadva. Összesen: ${foodData.length} étel.`);
                } catch (err) {
                    alert('Hibás fájl!');
                }
            };
            reader.readAsText(file);
        }

        function handleSort(e) {
            const column = e.target.dataset.sort;
            foodData.sort((a, b) => a[column].localeCompare(b[column]));
            filterTable(foodData);
        }

        // Inicializálás
        loadFoodData();

        document.getElementById('searchInput').addEventListener('input', () => filterTable(foodData));
        document.getElementById('recommendationFilter').addEventListener('change', () => filterTable(foodData));
        document.getElementById('clearSearchButton').addEventListener('click', clearSearch);
        document.getElementById('resetFiltersButton').addEventListener('click', resetFilters);
        document.getElementById('exportButton').addEventListener('click', exportData);
        document.getElementById('importInput').addEventListener('change', importData);

        document.querySelectorAll('th[data-sort]').forEach(header => {
            header.addEventListener('click', handleSort);
        });

        document.addEventListener('click', (e) => {
            if (editingName !== null && !e.target.closest('#foodTable')) {
                saveRow(editingName);
            }
        });
    </script>
</body>
</html>
