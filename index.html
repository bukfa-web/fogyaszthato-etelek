<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Étel Adatbázis</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192x192.png" />
    <link rel="apple-touch-icon" href="icon-512x512.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sort-asc::after { content: " ▲"; }
        .sort-desc::after { content: " ▼"; }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.3);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 p-4 min-h-screen">
    <h1 class="text-3xl font-bold text-center mb-6">Étel Adatbázis</h1>
    <div class="text-center mb-6 text-cyan-400">
        <a href="tapanyag-ajanlas.html" class="hover:underline">Tápanyag Ajánlás (110 kg-os férfi számára)</a> |
        <a href="szemelyre-szabott-tapanyag.html" class="hover:underline">Személyre szabott számító</a>
    </div>

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-wrap gap-2 mb-6">
            <input type="text" id="searchInput" placeholder="Keresés névben..." class="flex-1 min-w-64 p-3 bg-gray-700 rounded-lg text-white border border-gray-600">
            <button id="clearSearchButton" class="bg-red-600 hover:bg-red-700 text-white px-5 py-3 rounded-lg font-medium">Törlés</button>
            <button id="resetFiltersButton" class="bg-gray-600 hover:bg-gray-700 text-white px-5 py-3 rounded-lg font-medium">Reset</button>
            <select id="recommendationFilter" class="bg-gray-700 text-white px-5 py-3 rounded-lg border border-gray-600">
                <option value="">Összes ajánlás</option>
                <option value="Igen Kérek">Igen Kérek</option>
                <option value="Köszönöm nem kérek">Köszönöm nem kérek</option>
            </select>
            <select id="groupFilter" class="bg-gray-700 text-white px-5 py-3 rounded-lg border border-gray-600">
                <option value="">Minden csoport</option>
            </select>
            <button id="exportButton" class="bg-green-600 hover:bg-green-700 text-white px-5 py-3 rounded-lg font-medium">Export</button>
            <label class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-medium cursor-pointer">
                Import
                <input type="file" id="importInput" accept=".json" class="hidden">
            </label>
        </div>

        <div class="overflow-x-auto rounded-lg shadow-lg">
            <table id="foodTable" class="w-full border-collapse">
                <thead class="bg-gradient-to-r from-blue-800 to-blue-900 text-white sticky top-0">
                    <tr>
                        <th class="p-4 text-left cursor-pointer select-none" data-sort="name">Megnevezés</th>
                        <th class="p-4 text-left cursor-pointer select-none" data-sort="group">Étel csoport</th>
                        <th class="p-4 text-left cursor-pointer select-none" data-sort="recommendation">Ajánlás</th>
                        <th class="p-4 text-left cursor-pointer select-none" data-sort="note">Megjegyzés</th>
                        <th class="p-4 text-center">Műveletek</th>
                    </tr>
                </thead>
                <tbody class="bg-gray-800 divide-y divide-gray-700"></tbody>
            </table>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        let foodData = [];
        let filteredData = [];
        let sortColumn = 'name';
        let sortDirection = 'asc';
        let editingRow = null;

        function loadData() {
            // Alapadatok mindig a data.js-ből (initialFoodData változó)
            let baseData = [];
            if (typeof initialFoodData !== 'undefined' && Array.isArray(initialFoodData)) {
                baseData = initialFoodData.slice();
            }

            // Ha van localStorage-ban mentett adat → azt használjuk (felhasználói módosítások megmaradnak)
            const saved = localStorage.getItem('foodData');
            if (saved) {
                try {
                    const savedData = JSON.parse(saved);
                    foodData = savedData;
                    console.log("Adatok betöltve a localStorage-ból (felhasználói módosításokkal)");
                } catch (e) {
                    console.error("Hibás localStorage adat → alap data.js használata");
                    foodData = baseData;
                }
            } else {
                // Ha nincs localStorage → tiszta alapadatokat töltünk be a data.js-ből
                foodData = baseData;
                console.log("Adatok betöltve a data.js-ből (alap verzió)");
            }

            populateGroupFilter();
            applyFiltersAndSort();
        }

        function populateGroupFilter() {
            const groupFilter = document.getElementById('groupFilter');
            const groups = [...new Set(foodData.map(item => item.group).filter(Boolean))].sort();
            groupFilter.innerHTML = '<option value="">Minden csoport</option>';
            groups.forEach(group => {
                const opt = document.createElement('option');
                opt.value = group;
                opt.textContent = group;
                groupFilter.appendChild(opt);
            });
        }

        function applyFiltersAndSort() {
            let data = foodData.slice();

            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            if (search) {
                data = data.filter(item => (item.name || '').toLowerCase().includes(search));
            }

            const rec = document.getElementById('recommendationFilter').value;
            if (rec) {
                data = data.filter(item => item.recommendation === rec);
            }

            const group = document.getElementById('groupFilter').value;
            if (group) {
                data = data.filter(item => item.group === group);
            }

            data.sort((a, b) => {
                let valA = (a[sortColumn] || '').toString().toLowerCase();
                let valB = (b[sortColumn] || '').toString().toLowerCase();
                if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
                if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            filteredData = data;
            renderTable();
            updateSortIndicators();
        }

        function renderTable() {
            const tbody = document.querySelector('#foodTable tbody');
            tbody.innerHTML = '';

            if (filteredData.length === 0) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td colspan="5" class="p-8 text-center text-gray-500">Nincs találat</td>`;
                tbody.appendChild(tr);
                return;
            }

            filteredData.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = item.recommendation === 'Igen Kérek' 
                    ? 'bg-green-900/30 hover:bg-green-900/50' 
                    : 'bg-red-900/30 hover:bg-red-900/50';

                tr.innerHTML = `
                    <td class="p-4 border-r border-gray-700" ondblclick="startEdit(this, 'name')">${escapeHtml(item.name || '')}</td>
                    <td class="p-4 border-r border-gray-700" ondblclick="startEdit(this, 'group')">${escapeHtml(item.group || '')}</td>
                    <td class="p-4 border-r border-gray-700" ondblclick="startEdit(this, 'recommendation')">${escapeHtml(item.recommendation || '')}</td>
                    <td class="p-4 border-r border-gray-700" ondblclick="startEdit(this, 'note')">${escapeHtml(item.note || '')}</td>
                    <td class="p-4 text-center space-x-2">
                        <button class="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-1 rounded text-sm edit-btn">Szerk.</button>
                        <button class="bg-red-600 hover:bg-red-700 text-white px-4 py-1 rounded text-sm delete-btn">Töröl</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            addEventListeners();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addEventListeners() {
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = () => {
                    if (confirm('Biztosan törlöd ezt az ételt?')) {
                        const row = btn.closest('tr');
                        const name = row.cells[0].textContent.trim();
                        foodData = foodData.filter(item => item.name.trim() !== name);
                        saveToLocalStorage();
                        populateGroupFilter();
                        applyFiltersAndSort();
                    }
                };
            });

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.onclick = () => {
                    const row = btn.closest('tr');
                    const firstCell = row.cells[0];
                    startEdit(firstCell, 'name');
                };
            });
        }

        function startEdit(cell, field) {
            if (editingRow !== null && editingRow !== cell.parentElement) {
                cancelEdit();
            }

            editingRow = cell.parentElement;
            const originalValue = cell.textContent.trim();

            let input;
            if (field === 'recommendation') {
                input = document.createElement('select');
                input.innerHTML = `
                    <option value="Igen Kérek">Igen Kérek</option>
                    <option value="Köszönöm nem kérek">Köszönöm nem kérek</option>
                `;
                input.value = originalValue;
                input.className = 'bg-gray-700 text-white px-2 py-1 rounded border border-cyan-500';
            } else {
                input = document.createElement('input');
                input.type = 'text';
                input.value = originalValue;
                input.className = 'bg-gray-700 text-white px-2 py-1 rounded border border-cyan-500 w-full';
            }

            input.onblur = () => saveEdit(field, input.value.trim());
            input.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    saveEdit(field, input.value.trim());
                } else if (e.key === 'Escape') {
                    cancelEdit();
                }
            };

            cell.innerHTML = '';
            cell.appendChild(input);
            input.focus();
            if (input.tagName === 'INPUT') input.select();
        }

        function saveEdit(field, newValue) {
            if (!editingRow) return;

            const nameCell = editingRow.cells[0];
            const originalName = nameCell.textContent.trim() || nameCell.querySelector('input')?.value || '';

            const item = foodData.find(i => i.name.trim() === originalName);

            if (!item) {
                cancelEdit();
                return;
            }

            if (field === 'name' && newValue === '') {
                alert('A megnevezés nem lehet üres!');
                cancelEdit();
                return;
            }

            item[field] = newValue;

            saveToLocalStorage();
            if (field === 'group') {
                populateGroupFilter();
            }
            applyFiltersAndSort();
            editingRow = null;
        }

        function cancelEdit() {
            if (editingRow) {
                applyFiltersAndSort();
                editingRow = null;
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('foodData', JSON.stringify(foodData));
        }

        function updateSortIndicators() {
            document.querySelectorAll('th[data-sort]').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.sort === sortColumn) {
                    th.classList.add(sortDirection === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            });
        }

        function handleSort(e) {
            const th = e.target.closest('th');
            if (!th || !th.dataset.sort) return;
            const column = th.dataset.sort;
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            applyFiltersAndSort();
        }

        document.getElementById('searchInput').addEventListener('input', applyFiltersAndSort);
        document.getElementById('recommendationFilter').addEventListener('change', applyFiltersAndSort);
        document.getElementById('groupFilter').addEventListener('change', applyFiltersAndSort);
        document.getElementById('clearSearchButton').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            applyFiltersAndSort();
        });
        document.getElementById('resetFiltersButton').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('recommendationFilter').value = '';
            document.getElementById('groupFilter').value = '';
            applyFiltersAndSort();
        });
        document.getElementById('exportButton').addEventListener('click', () => {
            const dataStr = JSON.stringify(foodData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'fooddata_backup.json';
            a.click();
            URL.revokeObjectURL(url);
        });
        document.getElementById('importInput').addEventListener('change', importData);
        document.querySelector('thead').addEventListener('click', handleSort);
        document.addEventListener('click', (e) => {
            if (editingRow && !editingRow.contains(e.target)) {
                cancelEdit();
            }
        });

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    let imported = JSON.parse(event.target.result);
                    if (!Array.isArray(imported)) throw new Error('Nem tömb');
                    let added = 0;
                    imported.forEach(newItem => {
                        if (!foodData.some(item => (item.name || '').toLowerCase().trim() === (newItem.name || '').toLowerCase().trim())) {
                            foodData.push(newItem);
                            added++;
                        }
                    });
                    saveToLocalStorage();
                    populateGroupFilter();
                    applyFiltersAndSort();
                    alert(`Import sikeres! ${added} új étel hozzáadva. Összesen: ${foodData.length}`);
                } catch (err) {
                    alert('Hibás JSON fájl! Ellenőrizd a formátumot.');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        // Indítás
        loadData();
    </script>
</body>
</html>
